databaseChangeLog:
  - changeSet:
      id: 026-fix-id-sequence
      author: giovanna
      changes:
        - sql:
            sql: |
              SELECT setval(
                pg_get_serial_sequence('product', 'id'),
                COALESCE((SELECT MAX(id) FROM product), 1),
                true
              );

