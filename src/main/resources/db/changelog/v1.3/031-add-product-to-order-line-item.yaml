databaseChangeLog:
  - changeSet:
      id: 031-add-product-to-order-line-item
      author: giovanna

      changes:

        - addColumn:
            tableName: order_line_item
            columns:
              - column:
                  name: product_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: order_line_item
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_order_line_item_product