databaseChangeLog:
  - changeSet:
      id: 0073-create-payment-table
      author: giovanna

      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false


              - column:
                  name: payment_type
                  type: VARCHAR(31)
                  constraints:
                    nullable: false


              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false

              - column:
                  name: currency_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false


              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: last_four_digits
                  type: VARCHAR(4)

              - column:
                  name: expiration_month
                  type: VARCHAR(2)

              - column:
                  name: expiration_year
                  type: VARCHAR(4)


              - column:
                  name: payer_email
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: updated_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT

        - addColumn:
            tableName: purchase_order
            columns:
              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: purchase_order
            baseColumnNames: payment_id
            referencedTableName: payment
            referencedColumnNames: id
            constraintName: fk_purchase_order_payment